name: Go
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
        id: go

      - name: Get dependencies
        run: |
          make install

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --verbose

      - name: Lint Dockerfile
        run: |
          make lint-dockerfile

      - name: Build
        run: |
          make build

      - name: Test
        run: |
          make test

      - name: Verify API coverage table is up to date
        run: |
          make readme-coverage
          git diff --exit-code README.md || (echo "::error::README.md API coverage table is out of date — run 'make readme-coverage' and commit the changes" && exit 1)
